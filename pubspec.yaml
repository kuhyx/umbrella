name: umbrella
description: "Should I take an umbrella today? One answer, once a day."
publish_to: 'none'

version: 1.0.31+1

environment:
  sdk: ^3.12.2

dependencies:
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.5.1
      path: design_system
  flutter:
    sdk: flutter
  flutter_local_notifications: 23.0.3
  http: 1.6.0
  kuhy_credit:
    git:
      url: https://github.com/kuhyx/utils
      ref: kuhy-credit-v0.3.2
      path: kuhy_credit/flutter
  # Flutter 3.50 deprecates package:flutter/material.dart; Material lives here.
  material_ui: 1.11.1
  # Coarse "where am I" over AOSP LocationManager: no Google Play services.
  platform_location:
    git:
      url: https://github.com/kuhyx/utils
      ref: platform_location-v0.1.0
      path: platform_location
  shared_preferences: 2.5.6

dev_dependencies:
  # Generates the Android launcher icons from assets/icon/ (see
  # python_pkg/app_icons in testsAndMisc for the shared style).
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 24
